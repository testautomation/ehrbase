name: Build & Deploy Docker Image

on:
  push:
    branches:
      - 'develop'

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to DockerHub
        uses: docker/login-action@v1 
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push (AMD64)
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ehrbase/buildx:0.0.1-amd64
      -
        name: Build and push (ARM64)
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ehrbase/buildx:0.0.1-arm64
  
      - 
        name: Create and push MultiArch Manifest
        run: |
          docker buildx imagetools create \
                 ehrbase/buildx:0.0.1-arm \
                 ehrbase/buildx:0.0.1-amd \
                 -t ehrbase/buildx:0.0.1
          docker pull ehrbase/buildx:0.0.1
      -
        name: Inspect MultiArch Manifest
        run:  docker manifest inspect ehrbase/buildx:0.0.1
