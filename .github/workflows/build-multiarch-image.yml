name: Build & Deploy Docker Image

on:
  push:
    branches:
      - 'develop'

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to DockerHub
        uses: docker/login-action@v1 
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push (AMD64)
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ehrbase/buildx:0.0.1-amd64
      -
        name: Build and push (ARM64)
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ehrbase/buildx:0.0.1-arm64
  
      - 
        name: Create and push MultiArch Manifest
        run: |
          docker buildx imagetools create \
                 ehrbase/buildx:0.0.1-arm64 \
                 ehrbase/buildx:0.0.1-amd64 \
                 -t ehrbase/buildx:0.0.1
          docker pull ehrbase/buildx:0.0.1
      -
        name: Inspect MultiArch Manifest
        run:  docker manifest inspect ehrbase/buildx:0.0.1





# STEPS FOR LOCAL REPRODUCTION
# ============================
# provides build runtimes for addition platforms
# > docker run --privileged --rm tonistiigi/binfmt --install all
#
# creates a 'docker-container' driver
# which allows building for multiple platforms 
# > docker buildx create --use --name mybuild
#
# shows build Driver and available target platforms
# > docker buildx inspect mybuild
#
# builds image for specific platform
# and pushes it to docker-hub
# > docker buildx build --push --platform=linux/arm64 -t ehrbase/buildx:001-arm .
# > docker buildx build --push --platform=linux/amd64 -t ehrbase/buildx:001-amd .
#
# creates multiarch manifest from given images
# and pushes it to docker-hub
# > docker buildx imagetools create ehrbase/buildx:001-arm ehrbase/buildx:001-amd -t ehrbase/buildx:001
#
# inspects created mulitarch image
# > docker manifest inspect ehrbase/buildx:001
